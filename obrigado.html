<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-check {
            background: linear-gradient(135deg, #bd0000, #ff4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-[#820000] min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl card-shadow w-full max-w-md p-8 text-center">
        <div class="mb-6">
            <i class="fas fa-check-circle text-6xl gradient-check"></i>
        </div>
        
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Obrigado!</h1>
        
        <p class="text-gray-600 mb-6">
            Seu formulário foi enviado com sucesso. Entraremos em contato em breve.
        </p>
        
        <div class="mt-8">
            <a href="contact.html" class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-[#bd0000] to-[#ff4444] text-white font-medium rounded-lg hover:opacity-90 transition-all">
                <i class="fas fa-arrow-left mr-2"></i>
                Voltar
            </a>
        </div>
        
        <div class="mt-10 pt-6 border-t border-gray-200">
            <p class="text-sm text-gray-500">
                Precisa de ajuda? <a href="#" class="text-[#bd0000] hover:underline">Entre em contato</a>
            </p>
        </div>
    </div>

    <script>
        // Adicionando animação suave ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.card-shadow');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.4s ease-out';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
